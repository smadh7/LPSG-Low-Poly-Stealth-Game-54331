name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also build the Windows release binary"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: never

permissions:
  contents: write
  actions: read

jobs:
  linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
          # Rendering needs a window, and winit's X11 backend requires this
          # library at runtime. Ubuntu 24.04 renamed it for the time_t
          # transition, so try both spellings and report what we ended up with.
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0t64 \
            || sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 \
            || echo "WARNING: libxkbcommon-x11 not installed"
          ldconfig -p | grep -i xkbcommon || echo "no xkbcommon in the loader cache"
          # Screenshots below render on a CPU-only runner, which needs a
          # software Vulkan implementation (lavapipe) and a virtual X server.
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb libx11-xcb1 mesa-utils || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check
          # clippy/check and test variants each need their own compiled deps
          cache-all-crates: true

      - name: cargo check
        id: check
        continue-on-error: true
        run: cargo check --all-targets --message-format=short > >(tee check.log) 2>&1

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --message-format=short > >(tee clippy.log) 2>&1

      - name: cargo test
        id: test
        continue-on-error: true
        timeout-minutes: 30
        run: cargo test --all-targets --message-format=short > >(tee test.log) 2>&1

      - name: Publish logs to CI logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          mkdir -p out
          # Human summary
          {
            echo "SHA: $SHA"
            echo "BRANCH: $BRANCH"
            echo "MESSAGE: $MESSAGE"
            echo "CHECK: $CHECK"
            echo "CLIPPY: $CLIPPY"
            echo "TEST: $TEST"
          } > out/summary.txt
          # Trimmed logs: keep lines that matter, fall back to the tail.
          python3 - <<'PY'
          import os
          for src, dst, limit in [("check.log", "out/check.txt", 220000),
                                  ("clippy.log", "out/clippy.txt", 120000),
                                  ("test.log", "out/test.txt", 120000)]:
              if not os.path.exists(src):
                  open(dst, "w").write("(missing)\n")
                  continue
              lines = open(src, errors="replace").read().splitlines()
              keep = [l for l in lines if ("error" in l.lower() or "warning:" in l
                      or l.startswith("--> ") or "panicked" in l or "test result" in l
                      or "tests passed" in l or "test " in l and " ... " in l)]
              if not keep:
                  keep = lines
              text = "\n".join(keep)
              open(dst, "w").write(text[-limit:])
              # raw tail keeps multi-line panic messages intact
              open(dst.replace(".txt", "-raw.txt"), "w").write("\n".join(lines)[-limit:])
          PY
          cd out
          git init -q -b ci-logs
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add -A
          git commit -q -m "ci: logs for $RUN_NUMBER"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -q --force origin ci-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            check.log
            clippy.log
            test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Render level screenshots
        if: always()
        timeout-minutes: 30
        env:
          HITMAN_ASSET_ROOT: ${{ github.workspace }}/assets
        run: |
          set -x
          # A handful of viewpoints used to verify the level visually. Each run
          # boots the real game, renders one frame and exits.
          mkdir -p shots
          # Earlier steps only type-check the crate; the capture runs the game.
          cargo build --bin hitman_lowpoly
          { ldconfig -p | grep -i xkbcommon; ls -l /usr/lib/x86_64-linux-gnu/libxkbcommon*; } > shots/diag.txt 2>&1 || true
          cat shots/diag.txt || true
          # One process, six viewpoints: the engine boot and level upload are
          # the expensive part, so batching keeps this step fast.
          # The viewpoints that matter: exterior, lobby interior, gardens,
          # pool terrace, restaurant, a character close-up and an overview.
          export HITMAN_CAPTURE=\
          "01_hotel:0,3.2,-52,0,7,-4;02_lobby:0,2.6,20,0,2.4,-4;03_gardens:-18,1.9,12,2,1.6,-12;04_pool:36,2.2,-6,26,1.0,-24;05_restaurant:46,3.7,8,34,2.2,-4;06_character:0.9,1.5,-1.0,0,1.45,-3.4;07_overview:40,22,-62,0,7,-4"
          timeout 2400 xvfb-run -a -s "-screen 0 1600x900x24" \
            ./target/debug/hitman_lowpoly > shots/capture.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' shots/capture.log | tail -25
          mv captures/*.png shots/ 2>/dev/null || true
          ls -l shots || true

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          [ -d shots ] || exit 0
          cd shots
          rm -f diag.txt
          git init -q -b ci-shots
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add -A
          git commit -q -m "ci: screenshots for $RUN_NUMBER" || exit 0
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -q --force origin ci-shots

      - name: Fail if anything failed
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          echo "check=$CHECK test=$TEST"
          if [ "$CHECK" != "success" ] || [ "$TEST" != "success" ]; then
            echo "::error::cargo check or cargo test failed"
            exit 1
          fi

  smoke:
    name: Launch smoke test (headless renderer)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libx11-dev libxi-dev \
            xvfb
          sudo apt-get install -y --no-install-recommends mesa-utils 2>/dev/null || true
          # Ubuntu 24.04 renamed several packages for the time_t transition. A
          # single apt-get line fails wholesale if any name is wrong, so each
          # optional package is installed on its own and failures are tolerated.
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 \
            libx11-xcb1 libxcb1 libxcb-keysyms1 || true
          # If apt cannot supply it, take the .deb straight from the Ubuntu
          # archive and unpack it into /usr/lib (no dependency solving needed:
          # it only requires libxkbcommon0, which is already present).
          if ! ldconfig -p | grep -q libxkbcommon-x11; then
            cd /tmp
            for url in \
              http://archive.ubuntu.com/ubuntu/pool/main/libx/libxkbcommon/libxkbcommon-x11-0_1.6.0-1build1_amd64.deb \
              http://archive.ubuntu.com/ubuntu/pool/main/libx/libxkbcommon/libxkbcommon-x11-0_1.5.0-1_amd64.deb \
              http://archive.ubuntu.com/ubuntu/pool/main/libx/libxkbcommon/libxkbcommon-x11-0_1.4.1-1_amd64.deb; do
              if curl -fsSLO "$url"; then dpkg-deb -x "$(basename "$url")" /tmp/xkbextract || true; fi
            done
            sudo cp -av /tmp/xkbextract/usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
            sudo ldconfig || true
          fi
          echo "--- xkbcommon libraries visible to the loader:"
          ldconfig -p | grep -i xkbcommon || echo "NONE FOUND"
          ldconfig -p | grep -i xkbcommon || true
          ls -l /usr/lib/x86_64-linux-gnu/libxkbcommon* || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-smoke
      - name: Build the game binary
        run: cargo build --bin hitman_lowpoly
      - name: Run the real game for 300 frames
        env:
          HITMAN_SMOKE_FRAMES: "300"
          RUST_BACKTRACE: full
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUST_LOG: info
        run: |
          set -o pipefail
          # Software Vulkan (lavapipe) inside a virtual X server: this exercises
          # the full engine — window, renderer, all gameplay plugins — with no GPU.
          xvfb-run -a -s "-screen 0 1600x900x24" \
            vulkaninfo --summary > /dev/null 2>&1 || echo "vulkaninfo unavailable (continuing)"
          { echo "=== xkbcommon diagnostics"; ldconfig -p | grep -i xkbcommon;
            ls -l /usr/lib/x86_64-linux-gnu/libxkbcommon* 2>&1;
            apt-cache policy libxkbcommon-x11-0 libxkbcommon-x11-0t64 2>&1; } | tee smoke.log
          timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" \
            ./target/debug/hitman_lowpoly 2>&1 | tee -a smoke.log
          grep -q "SMOKE OK" smoke.log || { echo "::error::game did not reach the smoke-test exit"; tail -50 smoke.log; exit 1; }
          grep -q "npcs [1-9]" smoke.log || { echo "::error::no NPCs were spawned"; exit 1; }
          echo "smoke test passed"
      - name: Publish smoke log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          if not os.path.exists("smoke.log"):
              raise SystemExit(0)
          lines = open("smoke.log", errors="replace").read().splitlines()
          keep = lines
          body = "**Smoke test log** " + os.environ["SHA"][:8] + "\n```\n" + "\n".join(keep)[-30000:] + "\n```\n"
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["REPO"] + "/commits/" + os.environ["SHA"] + "/comments",
              data=json.dumps({"body": body[:65000]}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json", "User-Agent": "ci"},
              method="POST")
          try:
              with urllib.request.urlopen(req) as r:
                  print("posted smoke log", r.status)
          except Exception as e:
              print("post failed", e)
          PY

  windows:
    name: Build Windows release
    # Runs on every push to the working branch so the Section 11 deliverable
    # never rots; also available on demand.
    if: github.event_name == 'workflow_dispatch' && inputs.windows || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Build and package the portable distribution
        run: pwsh -NoProfile -File tools/package_windows.ps1

      # Section 11 requires the packaged build to be verified as a release, not
      # as a dev executable. This launches the shipped copy from a *different*
      # directory, with the repository out of reach, and checks it really runs.
      - name: Smoke-test the packaged build
        shell: pwsh
        run: |
          $src = "dist\HITMAN Coral Palm Resort"
          $test = Join-Path $env:RUNNER_TEMP "relocated\HITMAN Coral Palm Resort"
          New-Item -ItemType Directory -Path (Split-Path $test) -Force | Out-Null
          Copy-Item $src $test -Recurse
          Write-Host "Launching from $test"
          $env:HITMAN_SMOKE_FRAMES = "180"
          $env:RUST_LOG = "info"
          $exe = Join-Path $test "HITMAN Coral Palm Resort.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $test -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\out.log" `
                 -RedirectStandardError  "$env:RUNNER_TEMP\err.log"
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "packaged build did not exit" }
          $code = $p.ExitCode
          Get-Content "$env:RUNNER_TEMP\out.log","$env:RUNNER_TEMP\err.log" -ErrorAction SilentlyContinue |
            Select-Object -Last 60
          Write-Host "exit code: $code"
          if ($code -ne 0) { throw "packaged build exited with $code" }
          # A missing-asset build still starts, so assert the level actually loaded.
          $log = (Get-Content "$env:RUNNER_TEMP\out.log","$env:RUNNER_TEMP\err.log" -Raw -ErrorAction SilentlyContinue)
          if ($log -notmatch "SMOKE OK") { throw "packaged build did not report SMOKE OK" }
          if ($log -match "Path not found") { throw "packaged build could not find its assets" }
          Write-Host "Packaged build OK"

      - name: Verify the distribution layout
        shell: pwsh
        run: |
          $app = "dist\HITMAN Coral Palm Resort"
          $required = @(
            "$app\HITMAN Coral Palm Resort.exe",
            "$app\assets\textures\marble_basecolor.png",
            "$app\assets\shaders\water.wgsl",
            "$app\README.txt"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "missing from distribution: $f" }
          }
          $textures = (Get-ChildItem "$app\assets\textures" -Filter *.png).Count
          Write-Host "$textures texture maps shipped"
          if ($textures -lt 70) { throw "texture set is incomplete ($textures files)" }
          Get-ChildItem $app -Recurse | Measure-Object Length -Sum |
            ForEach-Object { Write-Host ("total size: {0:N1} MB" -f ($_.Sum / 1MB)) }

      - uses: actions/upload-artifact@v4
        with:
          name: HITMAN-Coral-Palm-Resort-windows-x86_64
          path: dist/HITMAN Coral Palm Resort-windows-x86_64.zip
          retention-days: 30
