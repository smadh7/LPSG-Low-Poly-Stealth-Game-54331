name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also build the Windows release binary"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: never

permissions:
  contents: write
  actions: read

jobs:
  linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check

      - name: cargo check
        id: check
        continue-on-error: true
        run: cargo check --all-targets --profile ci --message-format=short > >(tee check.log) 2>&1

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --profile ci --message-format=short -- -D warnings > >(tee clippy.log) 2>&1

      - name: cargo test
        id: test
        continue-on-error: true
        timeout-minutes: 30
        run: cargo test --all-targets --profile ci --message-format=short > >(tee test.log) 2>&1

      - name: Publish logs to CI logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          mkdir -p out
          # Human summary
          {
            echo "SHA: $SHA"
            echo "BRANCH: $BRANCH"
            echo "MESSAGE: $MESSAGE"
            echo "CHECK: $CHECK"
            echo "CLIPPY: $CLIPPY"
            echo "TEST: $TEST"
          } > out/summary.txt
          # Trimmed logs: keep lines that matter, fall back to the tail.
          python3 - <<'PY'
          import os
          for src, dst, limit in [("check.log", "out/check.txt", 220000),
                                  ("clippy.log", "out/clippy.txt", 120000),
                                  ("test.log", "out/test.txt", 120000)]:
              if not os.path.exists(src):
                  open(dst, "w").write("(missing)\n")
                  continue
              lines = open(src, errors="replace").read().splitlines()
              keep = [l for l in lines if ("error" in l.lower() or "warning:" in l
                      or l.startswith("--> ") or "panicked" in l or "test result" in l
                      or "tests passed" in l or "test " in l and " ... " in l)]
              if not keep:
                  keep = lines
              text = "\n".join(keep)
              open(dst, "w").write(text[-limit:])
          PY
          cd out
          git init -q -b ci-logs
          git config user.email "ci@example.com"
          git config user.name "CI"
          git add -A
          git commit -q -m "ci: logs for $RUN_NUMBER"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -q --force origin ci-logs

      - name: Fail if anything failed
        if: steps.check.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1

  windows:
    name: Build Windows release
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      - name: cargo build --release
        run: cargo build --release --message-format=short 2>&1 | Tee-Object -FilePath build.log
      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\hitman_lowpoly.exe dist\
          Compress-Archive -Path dist\* -DestinationPath hitman-low-poly-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hitman-low-poly-windows-x86_64
          path: hitman-low-poly-windows-x86_64.zip
          retention-days: 30
