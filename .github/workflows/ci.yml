name: CI
on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Check & Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets 2>&1 | tee check.log; exit ${PIPESTATUS[0]}
      - name: cargo test
        run: cargo test --all-targets 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
